<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>حاسبة العمر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07070f;
      --card: rgba(16, 20, 36, 0.78);
      --line: #3a4568;
      --text: #f4efe6;
      --muted: #9aa8b5;
      --gold: #e8b86d;
      --gold-dark: #c9923a;
      --ok: #7dcea0;
      --err: #f1948a;
      --nebula: #6b7cff;
      --nebula-2: #1b1030;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Cairo", sans-serif;
      color: var(--text);
      background: #05050c;
      transition: background 0.6s ease;
    }

    #sky {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .nebula {
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 70% 20%, color-mix(in srgb, var(--nebula) 38%, transparent), transparent 42%),
        radial-gradient(circle at 20% 80%, color-mix(in srgb, var(--nebula-2) 45%, transparent), transparent 48%);
      filter: blur(8px);
      transition: background 0.6s ease;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 48px 20px 72px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      font-weight: 800;
    }

    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 22px;
      backdrop-filter: blur(10px);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="date"] {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #101820;
      color: var(--text);
      font: inherit;
      font-size: 1.05rem;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 22px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(180deg, var(--gold), var(--gold-dark));
      color: #1a140c;
    }

    button:hover { filter: brightness(1.05); }

    .error {
      display: none;
      margin-top: 14px;
      color: var(--err);
      font-weight: 600;
    }

    .results { display: none; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .stat {
      background: rgba(10, 16, 28, 0.75);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .stat strong {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--gold);
    }

    .next {
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 16px;
      background: rgba(19, 32, 24, 0.75);
      border: 1px solid #2a4a38;
    }

    .next h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
      color: var(--ok);
    }

    .next p { margin: 6px 0; color: var(--text); }

    .birthday {
      background: rgba(42, 34, 16, 0.8);
      border-color: var(--gold-dark);
    }

    .birthday h2 { color: var(--gold); }

    .zodiac {
      margin-top: 28px;
    }

    .zodiac-title {
      margin: 0 0 6px;
      font-size: 1.25rem;
    }

    .zodiac-note {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .stars {
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      gap: 8px;
      justify-items: center;
    }

    .star-card {
      width: min(100%, 280px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 0 18px color-mix(in srgb, var(--nebula) 70%, white 10%));
    }

    .star-shape {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      clip-path: polygon(
        50% 2%, 61% 32%, 98% 35%, 70% 55%, 82% 92%,
        50% 74%, 18% 92%, 30% 55%, 2% 35%, 39% 32%
      );
      background:
        radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--nebula) 55%, #fff 8%), transparent 58%),
        linear-gradient(160deg, #16122a, color-mix(in srgb, var(--nebula-2) 80%, #000));
      border: 0;
    }

    .star-inner {
      width: 54%;
      text-align: center;
      padding: 8px 4px 18px;
    }

    .star-inner .label {
      display: block;
      font-size: 0.82rem;
      color: #d7deea;
      margin-bottom: 6px;
    }

    .star-inner .value {
      display: block;
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.45;
      color: #fff8ea;
    }

    .star-inner .glyph {
      display: block;
      font-size: 1.8rem;
      margin-bottom: 4px;
      color: var(--gold);
    }

    @media (max-width: 800px) {
      .stars { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="nebula"></div>

  <div class="wrap">
    <h1>حاسبة العمر</h1>
    <p class="lead">اعرف عمرك وبرجك وعيبو ومميزاتو</p>

    <form class="panel" id="form">
      <label for="birth">تاريخ الميلاد</label>
      <div class="row">
        <input id="birth" type="date" min="1901-01-01" required />
        <button type="submit">احسب</button>
      </div>
      <p class="error" id="error"></p>
    </form>

    <section class="results" id="results">
      <div class="grid">
        <div class="stat"><span>السنين</span><strong id="years">0</strong></div>
        <div class="stat"><span>الشهور</span><strong id="months">0</strong></div>
        <div class="stat"><span>الأيام</span><strong id="days">0</strong></div>
        <div class="stat"><span>الساعات</span><strong id="hours">0</strong></div>
        <div class="stat"><span>الدقايق</span><strong id="minutes">0</strong></div>
      </div>
      <div class="next" id="nextBox">
        <h2 id="nextTitle">عيد الميلاد الجاي</h2>
        <p id="nextDate"></p>
        <p id="nextLeft"></p>
        <p id="nextDays"></p>
      </div>

      <div class="zodiac">
        <h2 class="zodiac-title">برجك في السماء</h2>
        <p class="zodiac-note" id="zodiacRange"></p>
        <svg id="constellation" viewBox="0 0 100 46" width="100%" height="110" aria-hidden="true"></svg>
        <div class="stars">
          <article class="star-card">
            <div class="star-shape">
              <div class="star-inner">
                <span class="glyph" id="zodiacGlyph">✦</span>
                <span class="label">البرج</span>
                <span class="value" id="zodiacName"></span>
              </div>
            </div>
          </article>
          <article class="star-card">
            <div class="star-shape">
              <div class="star-inner">
                <span class="label">الميزة</span>
                <span class="value" id="zodiacGood"></span>
              </div>
            </div>
          </article>
          <article class="star-card">
            <div class="star-shape">
              <div class="star-inner">
                <span class="label">العيب</span>
                <span class="value" id="zodiacBad"></span>
              </div>
            </div>
          </article>
        </div>
      </div>
    </section>
  </div>

  <script>
    const SIGNS = {
      capricorn: {
        name: "الجدي",
        glyph: "♑",
        range: "22 ديسمبر — 19 يناير",
        good: "طموح ومنظم، بيكمل اللي بدأه.",
        bad: "قساوة زيادة، وصعوبة إنه يريح.",
        colors: ["#c9a227", "#2c2416"],
        stars: [[18, 28], [32, 18], [48, 22], [62, 12], [78, 20], [70, 34]],
        lines: [[0, 1], [1, 2], [2, 3], [3, 4], [2, 5]]
      },
      aquarius: {
        name: "الدلو",
        glyph: "♒",
        range: "20 يناير — 18 فبراير",
        good: "مبتكر وحر، بيفكّر بطريقة مختلفة.",
        bad: "يبعد عن الناس، ويصعب القرب منه.",
        colors: ["#6ec6ff", "#12243a"],
        stars: [[16, 16], [30, 28], [46, 14], [58, 30], [74, 18], [86, 32]],
        lines: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 5]]
      },
      pisces: {
        name: "الحوت",
        glyph: "♓",
        range: "19 فبراير — 20 مارس",
        good: "حنون وخياله واسع، بيحس بغيره بسرعة.",
        bad: "يهرب من الواقع، ويتأثر زيادة.",
        colors: ["#5ad0c6", "#102430"],
        stars: [[20, 12], [34, 24], [50, 16], [50, 32], [66, 24], [82, 14]],
        lines: [[0, 1], [1, 2], [1, 3], [3, 4], [4, 5]]
      },
      aries: {
        name: "الحمل",
        glyph: "♈",
        range: "21 مارس — 19 أبريل",
        good: "شجاع ويبدأ بسرعة، عنده طاقة عالية.",
        bad: "يندفع من غير تفكير، ويتوتر بسرعة.",
        colors: ["#ff6b4a", "#2a1210"],
        stars: [[22, 30], [38, 16], [52, 8], [66, 18], [80, 28]],
        lines: [[0, 1], [1, 2], [2, 3], [3, 4]]
      },
      taurus: {
        name: "الثور",
        glyph: "♉",
        range: "20 أبريل — 20 مايو",
        good: "ثابت ووفي، بيحب الأمان والجودة.",
        bad: "عنيد، وصعب يغيّر رأيه.",
        colors: ["#7dce7a", "#142016"],
        stars: [[24, 22], [40, 14], [40, 30], [58, 18], [74, 26], [86, 16]],
        lines: [[0, 1], [0, 2], [1, 3], [2, 3], [3, 4], [4, 5]]
      },
      gemini: {
        name: "الجوزاء",
        glyph: "♊",
        range: "21 مايو — 20 يونيو",
        good: "ذكي واجتماعي، بيتكلم ويتعلم بسرعة.",
        bad: "يتشتت، ويصعب يثبت على حاجة.",
        colors: ["#f4d35e", "#2a2410"],
        stars: [[22, 12], [22, 34], [50, 12], [50, 34], [78, 12], [78, 34]],
        lines: [[0, 1], [2, 3], [4, 5], [0, 2], [2, 4], [1, 3], [3, 5]]
      },
      cancer: {
        name: "السرطان",
        glyph: "♋",
        range: "21 يونيو — 22 يوليو",
        good: "عاطفي وحامي لأهله، ذاكرته قوية.",
        bad: "حساس زيادة، وياخد الأمور على صدره.",
        colors: ["#cfd8e6", "#1a2430"],
        stars: [[20, 24], [36, 14], [52, 22], [68, 12], [82, 26], [60, 34]],
        lines: [[0, 1], [1, 2], [2, 3], [3, 4], [2, 5]]
      },
      leo: {
        name: "الأسد",
        glyph: "♌",
        range: "23 يوليو — 22 أغسطس",
        good: "واثق وكريم، بيلف حواليه الناس.",
        bad: "يحب المدح زيادة، ويغار بسرعة.",
        colors: ["#ffb347", "#2a1a08"],
        stars: [[18, 28], [32, 16], [48, 10], [64, 18], [78, 12], [84, 30], [62, 34]],
        lines: [[0, 1], [1, 2], [2, 3], [3, 4], [3, 5], [5, 6]]
      },
      virgo: {
        name: "العذراء",
        glyph: "♍",
        range: "23 أغسطس — 22 سبتمبر",
        good: "دقيق ومنظم، بلاحظ التفاصيل الصغيرة.",
        bad: "يقلق ويحاسب نفسه والناس زيادة.",
        colors: ["#c4b59a", "#201c16"],
        stars: [[18, 16], [32, 28], [48, 14], [62, 30], [78, 18], [86, 32]],
        lines: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 5]]
      },
      libra: {
        name: "الميزان",
        glyph: "♎",
        range: "23 سبتمبر — 22 أكتوبر",
        good: "لبق وعادل، بيحب التوازن والجمال.",
        bad: "يتردد كتير، ويصعب ياخد قرار.",
        colors: ["#f5a6c8", "#2a1622"],
        stars: [[18, 22], [34, 14], [50, 28], [66, 14], [82, 24]],
        lines: [[0, 1], [1, 2], [2, 3], [3, 4], [1, 3]]
      },
      scorpio: {
        name: "العقرب",
        glyph: "♏",
        range: "23 أكتوبر — 21 نوفمبر",
        good: "عميق ومصرّ، شجاع في الأزمات.",
        bad: "يشك بسرعة، ويصعب ينسى الإساءة.",
        colors: ["#e0566a", "#1a0c12"],
        stars: [[16, 18], [30, 28], [46, 16], [62, 30], [78, 18], [86, 32]],
        lines: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 5]]
      },
      sagittarius: {
        name: "القوس",
        glyph: "♐",
        range: "22 نوفمبر — 21 ديسمبر",
        good: "متفائل وحب الحرية والسفر والتعلم.",
        bad: "يكلم من غير فلتر، ويطير من الالتزام.",
        colors: ["#9b6dff", "#160c28"],
        stars: [[20, 32], [36, 22], [52, 12], [68, 22], [82, 10], [78, 32]],
        lines: [[0, 1], [1, 2], [2, 3], [2, 4], [3, 5]]
      }
    };

    function getSignKey(month, day) {
      const md = month * 100 + day;
      if (md >= 1222 || md <= 119) return "capricorn";
      if (md <= 218) return "aquarius";
      if (md <= 320) return "pisces";
      if (md <= 419) return "aries";
      if (md <= 520) return "taurus";
      if (md <= 620) return "gemini";
      if (md <= 722) return "cancer";
      if (md <= 822) return "leo";
      if (md <= 922) return "virgo";
      if (md <= 1022) return "libra";
      if (md <= 1121) return "scorpio";
      return "sagittarius";
    }

    function drawConstellation(sign) {
      const svg = document.getElementById("constellation");
      const ns = "http://www.w3.org/2000/svg";
      svg.innerHTML = "";
      sign.lines.forEach(([a, b]) => {
        const line = document.createElementNS(ns, "line");
        line.setAttribute("x1", sign.stars[a][0]);
        line.setAttribute("y1", sign.stars[a][1]);
        line.setAttribute("x2", sign.stars[b][0]);
        line.setAttribute("y2", sign.stars[b][1]);
        line.setAttribute("stroke", sign.colors[0]);
        line.setAttribute("stroke-width", "0.7");
        line.setAttribute("opacity", "0.85");
        svg.appendChild(line);
      });
      sign.stars.forEach(([x, y], i) => {
        const dot = document.createElementNS(ns, "circle");
        dot.setAttribute("cx", x);
        dot.setAttribute("cy", y);
        dot.setAttribute("r", i === 2 ? 1.6 : 1.15);
        dot.setAttribute("fill", "#fff7d6");
        svg.appendChild(dot);
      });
    }

    function applySign(sign) {
      document.documentElement.style.setProperty("--nebula", sign.colors[0]);
      document.documentElement.style.setProperty("--nebula-2", sign.colors[1]);
      document.getElementById("zodiacGlyph").textContent = sign.glyph;
      document.getElementById("zodiacName").textContent = sign.name;
      document.getElementById("zodiacGood").textContent = sign.good;
      document.getElementById("zodiacBad").textContent = sign.bad;
      document.getElementById("zodiacRange").textContent = "الفترة: " + sign.range;
      drawConstellation(sign);
    }

    const sky = document.getElementById("sky");
    const ctx = sky.getContext("2d");
    let skyStars = [];

    function resizeSky() {
      sky.width = window.innerWidth;
      sky.height = window.innerHeight;
      skyStars = Array.from({ length: 140 }, () => ({
        x: Math.random() * sky.width,
        y: Math.random() * sky.height,
        r: Math.random() * 1.6 + 0.3,
        a: Math.random()
      }));
    }

    function twinkle() {
      ctx.clearRect(0, 0, sky.width, sky.height);
      skyStars.forEach((star) => {
        star.a += 0.02;
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${0.35 + Math.sin(star.a) * 0.35})`;
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(twinkle);
    }

    resizeSky();
    twinkle();
    window.addEventListener("resize", resizeSky);

    function isLeapYear(year) {
      return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
    }

    function daysInMonth(year, month) {
      const days = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      if (month === 2 && isLeapYear(year)) return 29;
      return days[month];
    }

    function isValidDate(year, month, day) {
      if (year < 1901 || month < 1 || month > 12 || day < 1) return false;
      return day <= daysInMonth(year, month);
    }

    function daysFrom1900(year, month, day) {
      let total = 0;
      for (let y = 1900; y < year; y++) total += isLeapYear(y) ? 366 : 365;
      for (let m = 1; m < month; m++) total += daysInMonth(year, m);
      return total + day - 1;
    }

    function calculate(year, month, day) {
      const now = new Date();
      const todayYear = now.getFullYear();
      const todayMonth = now.getMonth() + 1;
      const todayDay = now.getDate();

      if (!isValidDate(year, month, day)) {
        return { error: "التاريخ غير صحيح. استخدم تاريخ حقيقي من 1901 لحد النهاردة." };
      }

      if (
        year > todayYear ||
        (year === todayYear && month > todayMonth) ||
        (year === todayYear && month === todayMonth && day > todayDay)
      ) {
        return { error: "تاريخ الميلاد لا يمكن أن يكون في المستقبل." };
      }

      let ageInYear = todayYear - year;
      let ageInMonth = ageInYear * 12 + todayMonth - month;

      if (todayMonth < month || (todayMonth === month && todayDay < day)) {
        ageInYear--;
      }
      if (todayDay < day) ageInMonth--;

      const ageInDay =
        daysFrom1900(todayYear, todayMonth, todayDay) - daysFrom1900(year, month, day);
      const ageInHour = ageInDay * 24 + now.getHours();
      const ageInMinute = ageInDay * 24 * 60 + now.getHours() * 60 + now.getMinutes();

      let nextYear = todayYear;
      let nextMonth = month;
      let nextDay = day;

      if (todayMonth > month || (todayMonth === month && todayDay > day)) {
        nextYear++;
      }
      if (nextMonth === 2 && nextDay === 29 && !isLeapYear(nextYear)) {
        nextDay = 28;
      }

      let monthsLeft = (nextYear - todayYear) * 12 + (nextMonth - todayMonth);
      let daysLeftPart = 0;

      if (todayDay <= nextDay) {
        daysLeftPart = nextDay - todayDay;
      } else {
        monthsLeft--;
        let borrowMonth = nextMonth - 1;
        let borrowYear = nextYear;
        if (borrowMonth < 1) {
          borrowMonth = 12;
          borrowYear--;
        }
        daysLeftPart = daysInMonth(borrowYear, borrowMonth) - todayDay + nextDay;
      }

      const daysUntilBirthday =
        daysFrom1900(nextYear, nextMonth, nextDay) -
        daysFrom1900(todayYear, todayMonth, todayDay);

      return {
        ageInYear,
        ageInMonth,
        ageInDay,
        ageInHour,
        ageInMinute,
        nextYear,
        nextMonth,
        nextDay,
        monthsLeft,
        daysLeftPart,
        daysUntilBirthday,
        sign: SIGNS[getSignKey(month, day)]
      };
    }

    const form = document.getElementById("form");
    const birth = document.getElementById("birth");
    const errorEl = document.getElementById("error");
    const results = document.getElementById("results");
    const nextBox = document.getElementById("nextBox");

    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const dd = String(today.getDate()).padStart(2, "0");
    birth.max = `${yyyy}-${mm}-${dd}`;
    birth.min = "1901-01-01";

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      errorEl.style.display = "none";
      results.style.display = "none";

      if (!birth.value) {
        errorEl.textContent = "من فضلك اكتب تاريخ الميلاد.";
        errorEl.style.display = "block";
        return;
      }

      const [year, month, day] = birth.value.split("-").map(Number);
      const data = calculate(year, month, day);

      if (data.error) {
        errorEl.textContent = data.error;
        errorEl.style.display = "block";
        return;
      }

      document.getElementById("years").textContent = data.ageInYear.toLocaleString("ar-EG");
      document.getElementById("months").textContent = data.ageInMonth.toLocaleString("ar-EG");
      document.getElementById("days").textContent = data.ageInDay.toLocaleString("ar-EG");
      document.getElementById("hours").textContent = data.ageInHour.toLocaleString("ar-EG");
      document.getElementById("minutes").textContent = data.ageInMinute.toLocaleString("ar-EG");

      if (data.daysUntilBirthday === 0) {
        nextBox.classList.add("birthday");
        document.getElementById("nextTitle").textContent = "عيد ميلاد سعيد";
        document.getElementById("nextDate").textContent = "النهاردة عيد ميلادك.";
        document.getElementById("nextLeft").textContent = "";
        document.getElementById("nextDays").textContent = "";
      } else {
        nextBox.classList.remove("birthday");
        document.getElementById("nextTitle").textContent = "عيد الميلاد الجاي";
        document.getElementById("nextDate").textContent =
          "التاريخ: " + data.nextYear + "/" + data.nextMonth + "/" + data.nextDay;
        document.getElementById("nextLeft").textContent =
          "الفاضل: " + data.monthsLeft + " شهر و " + data.daysLeftPart + " يوم";
        document.getElementById("nextDays").textContent =
          "إجمالي الأيام: " + data.daysUntilBirthday.toLocaleString("ar-EG") + " يوم";
      }

      applySign(data.sign);
      results.style.display = "block";
    });
  </script>
</body>
</html>
